name: Run food item sync

on:
  schedule:
    # in utc time
    - cron: "45 17 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TZ: "Europe/Oslo"
    permissions:
      contents: read #This is required for actions/checkout
    defaults:
      run:
        working-directory: ./FoodItemsSyncProject
      

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x.x' 
          
      - name: Install dependencies
        run: dotnet restore
        
      - name: Run sync
        run: dotnet run
        
      - name: Get log file name
        id: logfilename
        run: echo "LOGFILENAME=debug$(date +'%Y%m%d').log" >> $GITHUB_ENV
        
      - name: Upload dotnet test results
        uses: actions/upload-artifact@v4
        with:
          name: sync-results
          path: ./FoodItemsSyncProject/logs/${{ env.LOGFILENAME }}
        if: ${{ always() }}
