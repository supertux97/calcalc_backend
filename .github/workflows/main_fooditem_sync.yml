name: Run sync

on:
    schedule:
        - cron: "0 23 * * *"
    workflow_dispatch:

jobs:
  sync:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./FoodItemssyncProject

    steps:
      - uses: actions/checkout@v6
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x.x' 
      - name: Install dependencies
        run: dotnet restore
      - name: Run sync
        run: dotnet run
      - name: Get log file anme
        id: logfilename
        run: echo "::set-output name=logfilename::debug$(date +'%Y%m%d').log"
      - name: Upload dotnet test results
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-results-${{ matrix.dotnet-version }}
          path:  logs/${{steps.logfilename.outputs.logfilename}}
        # Use always() to always run this step to publish test results when there are test failures
        if: ${{ always() }}
